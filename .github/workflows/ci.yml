name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile app.py explanations.py train_solar_dust.py
          python -m py_compile scripts/prepare_data.py scripts/make_xai_figures.py

      - name: Run tests
        run: python -m pytest

      - name: Generate XAI figures
        run: python scripts/make_xai_figures.py